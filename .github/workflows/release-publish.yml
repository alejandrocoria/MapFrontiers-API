name: Publish Release to Maven Central

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate release version
        shell: bash
        run: |
          PROJECT_VERSION="$(grep '^version=' gradle.properties | cut -d= -f2-)"
          RELEASE_TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [[ -z "$PROJECT_VERSION" ]]; then
            echo "Could not read version from gradle.properties"
            exit 1
          fi

          if [[ "$PROJECT_VERSION" == *-SNAPSHOT ]]; then
            echo "Release publishing requires a non-snapshot version in gradle.properties"
            exit 1
          fi

          if [[ "$PROJECT_VERSION" != "$RELEASE_TAG_VERSION" ]]; then
            echo "Tag version '$RELEASE_TAG_VERSION' does not match gradle.properties version '$PROJECT_VERSION'"
            exit 1
          fi

          echo "Publishing release version $PROJECT_VERSION"

      - name: Publish release to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon publishAggregationToCentralPortal
