name: Publish Snapshot to Maven Central

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate snapshot version
        shell: bash
        run: |
          PROJECT_VERSION="$(grep '^version=' gradle.properties | cut -d= -f2-)"

          if [[ -z "$PROJECT_VERSION" ]]; then
            echo "Could not read version from gradle.properties"
            exit 1
          fi

          if [[ "$PROJECT_VERSION" != *-SNAPSHOT ]]; then
            echo "Snapshot publishing requires gradle.properties version to end with -SNAPSHOT"
            exit 1
          fi

          echo "Publishing snapshot version $PROJECT_VERSION"

      - name: Publish snapshot to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon publishAggregationToCentralSnapshots
